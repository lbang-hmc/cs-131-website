<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Russell's paradox as a library catalog, and self-application in lambda calculus"><title>Russell's paradox as a library catalog, and self-application in lambda calculus</title><defs><marker id="ah1f2328" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ah57606a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ah7e22ce" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e22ce"/></marker></defs><rect x="1" y="1" width="758" height="348" rx="14" fill="#fbfaf8" stroke="#d8d4cc" stroke-width="1.5"/><g transform="translate(0,0)"><text x="210" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a" text-anchor="middle" font-weight="600">R = the catalog of all catalogs</text><text x="210" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a" text-anchor="middle" font-weight="600">that don't list themselves</text><rect x="185" y="140" width="50" height="66" rx="4" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><line x1="193" y1="140" x2="193" y2="206" stroke="#7e22ce" stroke-width="2"/><text x="213" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#7e22ce" text-anchor="middle" font-weight="700">R</text><rect x="135.0" y="72" width="150" height="36" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="210" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">R lists itself</text><rect x="243.0" y="155" width="150" height="36" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><text x="318" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="600">…then it shouldn't</text><rect x="135.0" y="238" width="150" height="36" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="210" y="261" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">R doesn't list itself</text><rect x="37.0" y="155" width="130" height="36" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><text x="102" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="600">…then it should</text><path d="M285,92 C320,96 330,120 325,152" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2328)"/><path d="M325,193 C330,228 315,250 288,254" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2328)"/><path d="M135,254 C105,250 95,225 98,194" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2328)"/><path d="M98,153 C95,120 105,96 134,92" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2328)"/><line x1="420" y1="30" x2="420" y2="290" stroke="#d8d4cc" stroke-width="1.5"/><text x="590" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a" text-anchor="middle" font-weight="600">in lambda calculus</text><text y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16"><tspan x="494.0" fill="#57606a" font-weight="normal">R</tspan><tspan x="513.2" fill="#57606a" font-weight="normal">=</tspan><tspan x="532.4 542.0 551.6 561.2 570.8 580.4 590.0 599.6" fill="#57606a" font-weight="normal">(λx.(Not</tspan><tspan x="618.8 628.4" fill="#57606a" font-weight="normal">(x</tspan><tspan x="647.6 657.2 666.8 676.4" fill="#57606a" font-weight="normal">x)))</tspan></text><text y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="28"><tspan x="548.0" fill="#1f2328" font-weight="normal">(</tspan><tspan x="564.8" fill="#7e22ce" font-weight="normal">R</tspan><tspan x="598.4" fill="#7e22ce" font-weight="normal">R</tspan><tspan x="615.2" fill="#1f2328" font-weight="normal">)</tspan></text><line x1="590" y1="160" x2="590" y2="198" stroke="#57606a" stroke-width="2" marker-end="url(#ah57606a)"/><text x="602" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#57606a" text-anchor="start" font-weight="normal">β</text><rect x="578.6" y="217.04" width="90.0" height="31.360000000000003" rx="5" fill="#f3e8ff" stroke="none" stroke-width="0"/><text y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="28"><tspan x="497.6 514.4 531.2 548.0" fill="#1f2328" font-weight="normal">(Not</tspan><tspan x="581.6" fill="#1f2328" font-weight="normal">(</tspan><tspan x="598.4" fill="#7e22ce" font-weight="normal">R</tspan><tspan x="632.0" fill="#7e22ce" font-weight="normal">R</tspan><tspan x="648.8 665.6" fill="#1f2328" font-weight="normal">))</tspan></text><path d="M690.4000000000001,230 C740.4000000000001,210 692.0,140 642.0,135" fill="none" stroke="#7e22ce" stroke-width="2" stroke-linecap="round" marker-end="url(#ah7e22ce)" stroke-dasharray="5 4"/><text x="590" y="280" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="normal">the same question again</text><text x="380" y="316" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606a" text-anchor="middle" font-weight="normal" font-style="italic">Set theory: a contradiction.   Lambda calculus: a reduction that never finishes.</text><text x="380" y="336" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606a" text-anchor="middle" font-weight="normal" font-style="italic">Related ideas, but different things.</text></g></svg>
