<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-label="One tree for (+ 1 2), two treatments: evaluated as an application it gives 3; used as the argument to quote it gives back a list value"><title>One tree for (+ 1 2), two treatments: evaluated as an application it gives 3; used as the argument to quote it gives back a list value</title><defs><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahc2410c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs><rect x="1" y="1" width="758" height="408" rx="14" fill="#fbfaf8" stroke="#d8d4cc" stroke-width="1.5"/><g transform="translate(0,0)"><text y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26"><tspan x="325.4" fill="#1f2328" font-weight="normal">(</tspan><tspan x="341.0" fill="#1f2328" font-weight="700">+</tspan><tspan x="372.2" fill="#1f2328" font-weight="normal">1</tspan><tspan x="403.4 419.0" fill="#1f2328" font-weight="normal">2)</tspan></text><text x="380" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal" font-style="italic">one S-expression, one tree</text><line x1="380" y1="127" x2="260" y2="158" stroke="#57606a" stroke-width="1.6"/><line x1="380" y1="127" x2="380" y2="158" stroke="#57606a" stroke-width="1.6"/><line x1="380" y1="127" x2="500" y2="158" stroke="#57606a" stroke-width="1.6"/><rect x="205.0" y="158.0" width="110" height="34" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.6"/><text x="260" y="180.04" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f2328" text-anchor="middle" font-weight=