<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-label="The interpreter pipeline: source text is parsed into an S-expression, the evaluator gives it meaning using an environment, and the resulting runtime value (cat) is printed"><title>The interpreter pipeline: source text is parsed into an S-expression, the evaluator gives it meaning using an environment, and the resulting runtime value (cat) is printed</title><defs><marker id="ah1f2328" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs><rect x="1" y="1" width="978" height="328" rx="14" fill="#fbfaf8" stroke="#d8d4cc" stroke-width="1.5"/><g transform="translate(0,0)"><rect x="20" y="50" width="190" height="190" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="2"/><text x="115.0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#57606a" text-anchor="middle" font-weight="700">Source text</text><rect x="270" y="50" width="190" height="190" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="365.0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1d4ed8" text-anchor="middle" font-weight="700">Parsed S-expression</text><rect x="520" y="50" width="190" height="190" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><text x="615.0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="700">Evaluator</text><rect x="770" y="50" width="190" height="190" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="865.0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#15803d" text-anchor="middle" font-weight="700">Runtime value</text><text x="42.0" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">"((lambda (x)</text><text x="67.2" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">(cons x '()))</text><text x="58.8" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">'cat)"</text><text x="115.0" y="224" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal" font-style="italic">just characters</text><line x1="365.0" y1="126" x2="320" y2="168" stroke="#1d4ed8" stroke-width="1.6"/><line x1="365.0" y1="126" x2="410" y2="168" stroke="#1d4ed8" stroke-width="1.6"/><rect x="330.0" y="103.0" width="70" height="26" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/><text x="365.0" y="120.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">List</text><rect x="276.0" y="167.0" width="88" height="26" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/><text x="320" y="184.32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="normal">(lambda …)</text><rect x="366.0" y="167.0" width="88" height="26" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/><text x="410" y="184.32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="normal">(quote cat)</text><text x="365.0" y="224" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal" font-style="italic">structure, not yet run</text><text x="615.0" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">rules for quote,</text><text x="615.0" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">lambda, application</text><rect x="538" y="148" width="154" height="56" rx="6" fill="#eef0f2" stroke="#d8d4cc" stroke-width="1.5"/><text x="615.0" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" text-anchor="middle" font-weight="700">environment</text><text x="615.0" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">cons ↦ primitive</text><text x="615.0" y="224" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal" font-style="italic">gives it meaning</text><rect x="820.0" y="118.0" width="90" height="40" rx="20" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/><text x="865.0" y="145.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#15803d" text-anchor="middle" font-weight="700">(cat)</text><text x="865.0" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">a list value holding</text><text x="865.0" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">the symbol cat</text><text x="865.0" y="224" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal" font-style="italic">the result</text><line x1="214" y1="145.0" x2="266" y2="145.0" stroke="#1f2328" stroke-width="2" marker-end="url(#ah1f2328)"/><text x="240.0" y="135.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">parse</text><line x1="464" y1="145.0" x2="516" y2="145.0" stroke="#1f2328" stroke-width="2" marker-end="url(#ah1f2328)"/><text x="490.0" y="135.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">evaluate</text><line x1="714" y1="145.0" x2="766" y2="145.0" stroke="#1f2328" stroke-width="2" marker-end="url(#ah1f2328)"/><text x="740.0" y="135.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">produce</text><line x1="865.0" y1="244" x2="865.0" y2="280" stroke="#1f2328" stroke-width="2" marker-end="url(#ah1f2328)"/><text x="875.0" y="268" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">print</text><text x="865.0" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="normal">(cat)</text><text x="700" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="end" font-weight="normal" font-style="italic">displayed on screen:</text><text x="20" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal" font-style="italic">example:</text><text x="92" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">((lambda (x) (cons x '())) 'cat)</text></g></svg>
